[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:migrate]
command=bash -c "python manage.py wait_for_db && python manage.py migrate --noinput && python manage.py seed_demo_user && python manage.py upsert_cortex_books_payout_client"
directory=/app
user=root
autostart=true
autorestart=false
startsecs=0
exitcodes=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=1

[program:django]
command=gunicorn --bind 0.0.0.0:8001 shizuha_id.wsgi:application --workers 2 --timeout 120
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="shizuha_id.settings"
priority=3

[program:mcp-server]
command=python /app/mcp-server/id_server.py --http-port 18102
directory=/app/mcp-server
user=root
autostart=true
autorestart=true
startsecs=3
startretries=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=SHIZUHA_ID_URL="http://localhost:8001",SHIZUHA_MCP_OAUTH_ENFORCE="true"
priority=10

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
