[project]
name = "shizuha-id"
version = "0.1.0"
description = "Shizuha identity and authentication service"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.14.0",
    "django-cors-headers>=4.3.0",
    "psycopg2-binary>=2.9.9",
    "djangorestframework-simplejwt>=5.3.0",
    "django-allauth>=0.61.0",
    "dj-rest-auth>=5.0.0",
    "PyJWT>=2.13.0",
    "cryptography>=41.0.0",
    "pyotp>=2.9.0",
    "google-auth>=2.25.0",
    "pyasn1>=0.6.4",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "drf-spectacular>=0.27.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "django-celery-beat>=2.5.0",
    "requests>=2.31.0",
    "idna>=3.15",
    "python-multipart>=0.0.32,<0.0.33",
    "firebase-admin>=6.0.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=21.2.0",
    "mcp>=2.0.0",
    "fido2>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis[lua]>=2.0.0",
]

[tool.uv]
package = false
